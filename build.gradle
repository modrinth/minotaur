plugins {
	id 'com.gradle.plugin-publish' version '1.2.0'
}

version = '2.9.0'
group = 'com.modrinth.minotaur'
base.archivesName = 'Minotaur'
description = 'Modrinth plugin for publishing builds to the website!'

String vendor = 'Modrinth'

repositories {
	mavenCentral()
	gradlePluginPortal()
}

dependencies {
	compileOnly gradleApi()
	compileOnly group: 'org.jetbrains', name: 'annotations', version: '+'
	api group: 'dev.masecla', name: 'Modrinth4J', version: '2.2.0'
	compileOnly group: 'io.papermc.paperweight', name: 'paperweight-userdev', version: '1.5.2'
	compileOnly annotationProcessor(group: 'org.projectlombok', name: 'lombok', version: '1.18.30')
	testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter', version: '5.10.0'
}

test {
	useJUnitPlatform()
}

gradlePlugin {
	website = 'https://modrinth.com'
	vcsUrl = 'https://github.com/modrinth/minotaur'
	plugins {
		minotaur {
			id = 'com.modrinth.minotaur'
			implementationClass = 'com.modrinth.minotaur.Minotaur'
			displayName = 'Minotaur'
			description = 'Modrinth plugin for publishing builds to the website!'
			tags.addAll('modrinth', 'publish', 'mods', 'minecraft')
		}
	}
}

jar {
	manifest {
		attributes([
			'Timestamp'               : System.currentTimeMillis(),
			'Specification-Title'     : base.archivesName,
			'Specification-Vendor'    : vendor,
			'Specification-Version'   : project.version,
			'Implementation-Title'    : base.archivesName,
			'Implementation-Version'  : project.version,
			'Implementation-Vendor'   : vendor,
			'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
			'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})"
		])
	}
}

java {
	withSourcesJar()
	withJavadocJar()
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release.set(8)
}
